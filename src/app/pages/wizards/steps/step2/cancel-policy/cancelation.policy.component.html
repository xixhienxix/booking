<div class="cancel-policy-card" *ngIf="policy" [ngClass]="policy.type">

  <!-- Icono según tipo -->
  <div class="policy-icon-wrap">
    <span class="policy-icon">
      <!-- Cancelación Gratuita: escudo -->
      <svg *ngIf="policy.type === 'free'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <!-- Reembolso Parcial: reloj de arena -->
      <svg *ngIf="policy.type === 'partial'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 22h14"/>
        <path d="M5 2h14"/>
        <path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/>
        <path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/>
      </svg>
      <!-- No Reembolsable: candado -->
      <svg *ngIf="policy.type === 'nonrefundable'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </span>
  </div>

  <!-- Contenido -->
  <div class="policy-content">
    <h4 class="policy-title">Política de cancelación</h4>

    <!-- Badge con nombre de la política -->
    <span class="policy-badge" [ngClass]="'badge-' + policy.type">
      {{ policy.label }}
    </span>

    <!-- Descripción dinámica -->
    <p class="policy-description" [innerHTML]="policy.description"></p>
  </div>

</div>
